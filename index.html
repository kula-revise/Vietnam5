<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietnam · Build the Skeleton</title>
<style>

  /* ============================================================
     IDENTITY BLOCK. This is the ONLY block you edit per series.
     Everything below the block is the fixed mechanism and never changes.
     Two accents, split by job:
       --a1  accent one: navigation, progress, emphasis, option letters,
             the primary button, the story date. The "structure" accent.
       --a2  accent two: anything the learner earned. correct answers,
             the running summary, breakdown bars, key facts, the last
             story line. The "reward" accent.
     Set --a1-rgb / --a2-rgb to the SAME colours as r,g,b (no #), so the
     tints and shadows track the accents. One face for facts (serif),
     one for structure (sans). See README for how to design a new skin.
     ============================================================ */
  :root{--sand:#12150F;--paper:#191D14;--cut:#20261A;--ink:#ECEBDB;--clay:#94A878;--fade:#8E8D7A;--a1:#94A878;--a1-rgb:148,168,120;--a2:#45A9AA;--a2-rgb:69,169,170;--ink-c:236,235,219;--fade-c:142,141,122;--opt-correct-bg:#17352A;--opt-wrong-bg:#2E2420;--chip-argue-bg:#262019;--chip-argue-fg:#C9A97F;--on-ink:#12150F;--mute1:#B0AE98;--mute2:#A9A791;--ink-hover:#E4E3D2;--chip-instinct-bg:#201E16;--sort-bg:rgba(255,255,255,0.05);--a2-hover:#3A9091;--serif:Georgia, 'Times New Roman', serif;--sans:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;}
  body.bright{--sand:#EFE9DC;--paper:#FAF6EC;--cut:#FFFDF6;--ink:#23302E;--clay:#5F6B52;--fade:#7C7B6D;--a1:#6E7F5C;--a1-rgb:110,127,92;--a2:#1E6A6B;--a2-rgb:30,106,107;--ink-c:27,42,51;--fade-c:123,114,99;--opt-correct-bg:#E2EDE4;--opt-wrong-bg:#F2DDD3;--chip-argue-bg:#E7D6C4;--chip-argue-fg:#7B3F1C;--on-ink:#F4EADA;--mute1:#4a463f;--mute2:#55504a;--ink-hover:#12202a;--chip-instinct-bg:#EADFC9;--sort-bg:rgba(255,255,255,0.4);--a2-hover:#164C3F;}
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(var(--ink-c),0.028) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse at top right, rgba(var(--a1-rgb),0.10) 0%, transparent 58%),
      radial-gradient(ellipse at bottom left, rgba(var(--a2-rgb),0.09) 0%, transparent 58%),
      var(--sand);
    padding: 1.6rem 1rem 3rem;
    font-family: var(--serif);
    color: var(--ink); line-height: 1.6; -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .top-bar { margin-bottom: 1.6rem; }
  .top-meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.55rem; gap: 1rem; flex-wrap: wrap; }
  .top-count { color: var(--fade); font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .track { height: 3px; background: rgba(var(--ink-c),0.12); overflow: hidden; }
  .fill { height: 100%; background: var(--a1); transition: width 0.35s ease; width: 0%; }

  /* Cover */
  .cover { text-align: center; padding: 1.2rem 0 1rem; }
  .cover-eyebrow { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 1.4rem; }
  .cover-title { font-size: clamp(2.3rem,7vw,3.6rem); font-weight: 800; line-height: 1.03; letter-spacing: -0.025em; margin-bottom: 1.3rem; }
  .flourish { width: 92px; height: 9px; margin: 0 auto 1.6rem;
    background:
      radial-gradient(circle at 9px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 46px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 83px 4.5px, var(--a1) 0 4px, transparent 4.5px); }
  .cover-line { font-size: 1.16rem; line-height: 1.7; color: var(--mute1); font-style: italic; max-width: 30rem; margin: 0 auto 2rem; min-height: 5.5rem; }
  .cover-line span { opacity: 0; transition: opacity 0.5s ease; }
  .cover-line span.vis { opacity: 1; }
  .cover-time { font-family: var(--sans); font-size: 0.8rem; color: var(--fade); margin-top: 1.4rem; letter-spacing: 0.02em; }
  .btn-begin { font-family: var(--sans); display: inline-flex; align-items: center; gap: 0.8rem; padding: 1.05rem 2.2rem; background: var(--ink); color: var(--on-ink); border: none; cursor: pointer; font-size: 1.12rem; font-weight: 700; }
  .btn-begin:hover { background: var(--ink-hover); }
  .btn-begin .sa { color: var(--a1); font-size: 1.3rem; }
  .skip-link { display: block; margin: 1.6rem auto 0; background: transparent; border: none; color: var(--fade); font-family: var(--sans); font-size: 0.84rem; cursor: pointer; text-decoration: underline; }

  /* Story hook */
  .story { padding: 0.6rem 0 0.4rem; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; }
  .story-num { font-family: var(--serif); font-size: clamp(2.6rem,9vw,4rem); font-weight: 800; color: var(--a1); line-height: 1; letter-spacing: -0.02em; }
  .story-unit { font-family: var(--sans); font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fade); font-weight: 700; margin-top: 0.5rem; }
  .story-rule { width: 100%; height: 1px; background: rgba(var(--ink-c),0.22); margin: 1.4rem 0 1.6rem; }
  .story-line { font-size: 1.24rem; line-height: 1.66; margin-bottom: 1.05rem; opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .story-line.vis { opacity: 1; transform: translateY(0); }
  .story-line.last { color: var(--a2); font-style: italic; font-weight: 600; }

  /* Content cards */
  .card { background: var(--paper); border: 1px solid rgba(var(--ink-c),0.12); border-left: 5px solid var(--a1); padding: 1.7rem 1.5rem; margin-bottom: 1.3rem; }
  .stage-tag { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.9rem; }
  .card h2 { font-family: var(--sans); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 0.9rem; }
  .card p { font-size: 1.04rem; line-height: 1.74; margin-bottom: 0.9rem; }
  .card p:last-child { margin-bottom: 0; }
  .key { color: var(--a2); font-weight: 700; }        /* one emphasis colour, body face kept */
  .card strong { color: var(--a2); font-weight: 700; }
  .pull { border-left: 4px solid var(--a2); padding: 0.15rem 0 0.15rem 1rem; font-weight: 600; color: var(--ink); margin: 1.15rem 0; font-style: italic; }
  .figure { margin: 1rem 0 0.3rem; }
  .figure img { display: block; height: auto; border: 1px solid rgba(var(--ink-c),0.18); margin: 0 auto; }
  .figure.wide img { width: 100%; max-width: 460px; }
  .figure.portrait img { width: 100%; max-width: 320px; }
  .figure figcaption { font-family: var(--serif); font-size: 0.82rem; color: var(--fade); margin-top: 0.5rem; line-height: 1.55; text-align: center; }

  /* Carousel */
  .car-wrap { margin: 0.4rem 0 0; }
  .car-prompt { font-family: var(--sans); font-size: 0.82rem; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }
  .car-frame { background: var(--cut); border: 1px solid rgba(var(--ink-c),0.14); border-top: 3px solid var(--a1); padding: 1.4rem 1.35rem; min-height: 8.5rem; display: flex; align-items: center; }
  .car-card { font-size: 1.06rem; line-height: 1.7; width: 100%; }
  .car-card .cc-lead { font-family: var(--sans); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--clay); display: block; margin-bottom: 0.5rem; }
  .car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 0.9rem; gap: 1rem; }
  .car-dots { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .car-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(var(--ink-c),0.2); }
  .car-dot.read { background: var(--a2); }
  .car-dot.here { outline: 2px solid var(--a1); outline-offset: 2px; }
  .car-count { font-family: var(--sans); font-size: 0.78rem; color: var(--fade); font-weight: 600; }
  .car-btns { display: flex; gap: 0.5rem; }
  .car-btn { font-family: var(--sans); width: 2.4rem; height: 2.4rem; background: var(--paper); border: 1px solid rgba(var(--ink-c),0.28); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
  .car-btn:disabled { opacity: 0.32; cursor: not-allowed; }

  /* Stat strip */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 0.8rem; margin: 0.5rem 0 0.2rem; }
  .stat { background: var(--cut); border: 1px solid rgba(var(--ink-c),0.12); border-top: 3px solid var(--a2); padding: 1.1rem 0.7rem; text-align: center; }
  .stat-num { font-family: var(--serif); font-size: 2rem; font-weight: 800; color: var(--a2); line-height: 1; letter-spacing: -0.02em; }
  .stat-label { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--fade); margin-top: 0.5rem; line-height: 1.4; }

  /* Key terms + memory boxes (collapsed) */
  /* Key terms strip: label + individual expandable chips */
  .kt { margin-top: 1.3rem; }
  .kt-label { font-family: var(--sans); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--a1); padding-top: 0.85rem; border-top: 1px dashed rgba(var(--fade-c),0.4); }
  .kt-row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.85rem; }
  .kt-term { border: 1px solid rgba(var(--ink-c),0.24); background: transparent; }
  .kt-term summary { font-family: var(--sans); font-size: 0.92rem; font-weight: 600; color: var(--ink); cursor: pointer; list-style: none; padding: 0.55rem 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem; }
  .kt-term summary::-webkit-details-marker { display: none; }
  .kt-term summary::after { content: "+"; color: var(--a1); font-weight: 800; font-size: 1.05rem; }
  .kt-term[open] { display: block; width: 100%; }
  .kt-term[open] summary::after { content: "\2212"; }
  .kt-def { font-size: 0.94rem; line-height: 1.62; color: var(--mute2); padding: 0 0.85rem 0.75rem; }

  /* Remember box (collapsed) */
  .remember { margin-top: 0.9rem; border-top: 1px dashed rgba(var(--fade-c),0.4); padding-top: 0.7rem; }
  .remember summary { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; color: var(--a1); cursor: pointer; list-style: none; }
  .remember summary::-webkit-details-marker { display: none; }
  .remember summary::before { content: "+ "; font-weight: 800; }
  .remember[open] summary::before { content: "\2212 "; }
  .remember .disc-body { font-size: 0.96rem; line-height: 1.68; color: var(--mute1); margin-top: 0.6rem; background: rgba(var(--a2-rgb),0.06); border-left: 3px solid var(--a2); padding: 0.7rem 0.9rem; }

  /* Sources */
  .source { position: relative; background: var(--cut); border: 1px solid rgba(var(--ink-c),0.12); border-top: 3px solid var(--a2); box-shadow: 6px 6px 0 rgba(var(--a2-rgb),0.13); padding: 1.2rem 1.3rem; margin: 1.15rem 0 1.6rem; }
  .source-attr { font-family: var(--sans); font-size: 0.8rem; color: var(--clay); font-weight: 600; margin-bottom: 0.75rem; line-height: 1.5; }
  .source-body { font-size: 1.02rem; line-height: 1.74; }
  .source-body em { color: var(--a2); font-style: italic; }
  .toggle-btn { font-family: var(--sans); background: transparent; border: none; color: var(--a1); cursor: pointer; font-size: 0.88rem; font-weight: 600; text-decoration: underline; padding: 0.7rem 0 0; }
  .toggle-body { display: none; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed rgba(var(--fade-c),0.45); font-size: 0.94rem; color: var(--mute2); line-height: 1.66; }
  .toggle-body.open { display: block; }

  /* Questions */
  .q-text { font-size: 1.16rem; line-height: 1.5; font-weight: 600; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }
  .option { display: flex; align-items: flex-start; gap: 0.85rem; padding: 1rem 1.05rem; background: var(--sand); border: 1px solid rgba(var(--ink-c),0.13); cursor: pointer; font-family: var(--serif); text-align: left; font-size: 0.99rem; line-height: 1.55; color: var(--ink); width: 100%; }
  .option:hover:not(:disabled) { background: var(--cut); border-color: var(--a1); }
  .option:disabled { cursor: default; }
  .option.selected { background: var(--cut); border-color: var(--a1); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.correct { background: var(--opt-correct-bg); border-color: var(--a2); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.wrong { background: var(--opt-wrong-bg); border-color: var(--clay); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.dimmed { opacity: 0.46; }
  .opt-letter { font-family: var(--serif); font-weight: 800; color: var(--a1); min-width: 1.1rem; }
  .opt-text { flex: 1; }
  .opt-mark { font-weight: 700; font-size: 1.1rem; }
  .explanation { background: var(--cut); border: 1px solid rgba(var(--ink-c),0.12); border-left: 5px solid var(--a2); padding: 1.15rem 1.2rem; }
  .expl-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.5rem; }
  .expl-text { line-height: 1.7; font-size: 0.96rem; }
  .chip { display: inline-block; font-family: var(--sans); padding: 0.22rem 0.65rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .chip-argue { background: var(--chip-argue-bg); color: var(--chip-argue-fg); }
  .chip-evidence { background: var(--chip-argue-bg); color: var(--chip-argue-fg); }
  .chip-weigh { background: var(--a2); color: #F0E3CF; }
  .chip-instinct { background: var(--chip-instinct-bg); color: var(--clay); }
  .q-meta { margin-bottom: 0.9rem; }

  /* order + sort interactions */
  .inter { margin: 0.4rem 0 1rem; }
  .inter-pool { display: flex; flex-direction: column; gap: 0.5rem; }
  .inter-item { font-family: var(--serif); text-align: left; padding: 0.85rem 1rem; background: var(--sand); border: 1px solid rgba(var(--ink-c),0.16); cursor: pointer; font-size: 0.97rem; line-height: 1.5; color: var(--ink); display: flex; gap: 0.7rem; align-items: baseline; }
  .inter-item:hover:not(:disabled) { border-color: var(--a1); background: var(--cut); }
  .inter-item .rank { font-family: var(--sans); font-weight: 800; color: var(--a1); min-width: 1.4rem; }
  .inter-placed { background: var(--cut); border-color: var(--a2); }
  .inter-item.ok { background: var(--opt-correct-bg); border-color: var(--a2); }
  .inter-item.no { background: var(--opt-wrong-bg); border-color: var(--clay); }
  .sort-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .sort-col { background: var(--sort-bg); border: 1px dashed rgba(var(--ink-c),0.28); padding: 0.7rem; min-height: 4rem; }
  .sort-col h4 { font-family: var(--sans); font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.6rem; text-align: center; }
  .sort-btns { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .sort-place { font-family: var(--sans); flex: 1; font-size: 0.78rem; font-weight: 700; padding: 0.4rem; background: var(--paper); border: 1px solid rgba(var(--ink-c),0.24); cursor: pointer; color: var(--ink); }

  /* Running summary */
  .runsum { background: rgba(var(--a2-rgb),0.08); border: 1px solid rgba(var(--a2-rgb),0.28); border-left: 5px solid var(--a2); padding: 1.3rem 1.4rem; }
  .runsum-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.9rem; }
  .runsum ol { margin: 0; padding-left: 1.3rem; }
  .runsum li { font-size: 1.02rem; line-height: 1.66; margin-bottom: 0.7rem; color: var(--ink); }
  .runsum li:last-child { margin-bottom: 0; }
  .runsum li.fresh { font-weight: 700; color: var(--a2); }

  /* Popup */
  .pop-back { position: fixed; inset: 0; background: rgba(var(--ink-c),0.5); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50; }
  .pop { background: var(--paper); border-top: 5px solid var(--a2); padding: 1.6rem 1.5rem; max-width: 30rem; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .pop-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }
  .pop-text { font-size: 1.1rem; line-height: 1.6; font-weight: 600; color: var(--ink); margin-bottom: 1.3rem; }
  .pop-btn { font-family: var(--sans); width: 100%; padding: 0.9rem; background: var(--a2); border: none; color: #F7F1E4; font-size: 0.98rem; font-weight: 700; cursor: pointer; }

  /* Nav */
  .nav { display: flex; justify-content: space-between; gap: 0.8rem; margin-top: 1rem; }
  .btn-secondary { font-family: var(--sans); padding: 0.8rem 1.2rem; background: transparent; border: 1px solid rgba(var(--ink-c),0.28); color: var(--ink); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn-secondary:hover:not(:disabled) { background: var(--paper); }
  .btn-primary { font-family: var(--sans); padding: 0.85rem 1.5rem; background: var(--a2); border: none; color: #F7F1E4; font-size: 0.95rem; cursor: pointer; font-weight: 700; }
  .btn-primary:hover:not(:disabled) { background: var(--a2-hover); }
  .btn-primary:disabled { opacity: 0.34; cursor: not-allowed; }

  /* Results */
  .results-head { text-align: center; margin-bottom: 1.8rem; }
  .results-eyebrow { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.8rem; }
  .results-title { font-family: var(--sans); font-size: clamp(1.9rem,5.5vw,2.7rem); font-weight: 800; letter-spacing: -0.02em; }
  .score-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 0.9rem; margin-bottom: 1.4rem; }
  .score-block { background: var(--paper); border: 1px solid rgba(var(--ink-c),0.12); border-top: 4px solid var(--a1); padding: 1.3rem 0.8rem; text-align: center; }
  .score-num { font-family: var(--serif); font-size: 2.6rem; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -0.03em; }
  .score-den { font-family: var(--serif); font-size: 1.1rem; color: var(--fade); font-weight: 500; }
  .score-word { font-family: var(--serif); font-size: 1.3rem; font-weight: 800; color: var(--a2); line-height: 2; }
  .score-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fade); margin-top: 0.5rem; font-weight: 700; }
  .grade-desc { text-align: center; margin-bottom: 1.6rem; padding: 0 0.5rem; line-height: 1.66; }
  .breakdown { background: var(--paper); border: 1px solid rgba(var(--ink-c),0.12); padding: 1.3rem; margin-bottom: 1.4rem; }
  .breakdown-label { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 1rem; text-align: center; }
  .bd-row { display: grid; grid-template-columns: 1fr 110px 46px; gap: 0.7rem; align-items: center; margin-bottom: 0.7rem; font-family: var(--serif); font-size: 0.9rem; }
  .bd-name { font-weight: 600; }
  .bd-bar { height: 9px; background: rgba(var(--ink-c),0.08); overflow: hidden; }
  .bd-fill { height: 100%; background: var(--a2); }
  .bd-score { color: var(--fade); text-align: right; font-weight: 700; }
  .results-actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; }
  .results-actions button { flex: 1; }
  .hidden { display: none !important; }

body { padding-bottom: 5.25rem !important; } #kula-mode-toggle, .mode-toggle { min-height: 44px !important; padding-top: 0.6rem !important; padding-bottom: 0.6rem !important; box-sizing: border-box !important; } /* kula: mobile tap targets. Every control a learner is expected to tap reaches 44px on the short axis at 360px. */ .evtoggle, .term-btn, .toggle-btn, #skip-btn, #chk, #cont, summary, details > summary { min-height: 44px !important; display: flex !important; align-items: center !important; box-sizing: border-box !important; } summary, details > summary { padding-top: 0.5rem !important; padding-bottom: 0.5rem !important; } #next-btn, #finish-btn, #cap-advance, #kdone-btn, #kretake-btn, #cont, #chk, #begin-btn, #back-btn, #redo-btn, #restart-btn, #skip-btn, .btn-primary, .btn-secondary, .btn-small { position: relative; z-index: 10000; }
#next-btn, #begin-btn, #kdone-btn, #kretake-btn { min-height: 44px !important; }
/* vt-cta */
body:not(.bright) .btn-primary, body:not(.bright) #next-btn { color: #12150f !important; }
body:not(.bright) .btn-primary .sa, body:not(.bright) #next-btn .sa, body:not(.bright) .btn-primary svg, body:not(.bright) #next-btn svg { color: #12150f !important; fill: #12150f !important; }

.container{max-width:720px;margin:0 auto;padding:1.2rem 1.1rem 3rem;}
.cap-intro{font-size:1.04rem;line-height:1.74;margin-bottom:1.1rem;}
.yourpoint{background:var(--cut);border:1px solid rgba(var(--ink-c),0.12);border-left:4px solid var(--a2);padding:0.8rem 0.95rem;margin-bottom:1.1rem;font-family:var(--serif);font-size:1rem;line-height:1.5;}
.yourpoint b{display:block;font-family:var(--sans);font-size:0.62rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--a2);font-weight:700;margin-bottom:0.3rem;}
.evlist{display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1.2rem;}
.evrow{display:flex;align-items:center;gap:0.85rem;padding:0.85rem 1rem;background:var(--sand);border:1px solid rgba(var(--ink-c),0.13);}
.evrow .evtext{flex:1;font-family:var(--serif);font-size:1rem;line-height:1.55;}
.evrow .evtext .off{display:block;font-family:var(--sans);font-size:0.78rem;color:var(--mute2);margin-top:0.2rem;}
.evtoggle{font-family:var(--sans);font-size:0.78rem;font-weight:700;border:1px solid var(--a2);color:var(--a2);background:transparent;padding:0.4rem 0.85rem;cursor:pointer;min-height:38px;white-space:nowrap;}
.evrow.use{border-color:var(--a1);border-width:2px;background:var(--cut);}
.evrow.use .evtoggle{background:var(--a2);color:#F7F1E4;border-color:var(--a2);}
.evrow.ok{border-color:var(--a2);border-width:2px;background:var(--opt-correct-bg);}
.evrow.miss{border-color:var(--clay);border-style:dashed;border-width:2px;}
.evrow.wrong{border-color:var(--clay);border-width:2px;background:var(--opt-wrong-bg);}
.evtag{font-family:var(--sans);font-size:0.7rem;font-weight:700;letter-spacing:0.08em;}
.evtag.y{color:var(--a2);} .evtag.n{color:var(--clay);}
.frame{border:1px solid rgba(var(--ink-c),0.14);border-left:5px solid var(--a2);background:var(--cut);padding:1.2rem 1.3rem;margin-bottom:1.2rem;}
.frame .fp{padding:0.7rem 0 0.95rem;border-bottom:1px dashed rgba(var(--ink-c),0.2);}
.frame .fp:last-child{border-bottom:none;padding-bottom:0;}
.frame .frole{font-family:var(--sans);font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--a2);font-weight:700;margin-bottom:0.3rem;}
.frame .fts{font-family:var(--serif);font-weight:700;font-size:1.02rem;line-height:1.5;margin-bottom:0.5rem;}
.frame .flabel{font-family:var(--sans);font-size:0.66rem;font-weight:700;color:var(--mute2);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.2rem;}
.frame ul{margin:0.1rem 0 0.6rem;padding-left:1.15rem;}
.frame li{font-family:var(--serif);margin-bottom:0.25rem;line-height:1.5;}
.frame .flink{font-family:var(--serif);font-style:italic;color:var(--mute1);}
.writeup{font-family:var(--sans);background:var(--paper);border:1px solid rgba(var(--a1-c),0.4);border-left:5px solid var(--a1);padding:1.1rem 1.2rem;}
.writeup b{color:var(--a1);font-size:1.05rem;}
.writeup .wsub{font-size:0.92rem;line-height:1.6;color:var(--mute1);margin-top:0.4rem;}
.cap-prog{font-family:var(--sans);font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--mute2);font-weight:700;margin-bottom:0.9rem;}
.cap-actions{display:flex;justify-content:flex-end;}
#kula-mode-toggle{position:fixed;top:0.7rem;right:0.7rem;z-index:60;font-family:var(--sans);font-size:0.7rem;font-weight:700;letter-spacing:0.06em;background:var(--cut);color:var(--ink);border:1px solid rgba(var(--ink-c),0.2);border-radius:20px;padding:0.4rem 0.9rem;cursor:pointer;min-height:34px;}
#kula-mode-toggle:hover{border-color:var(--a2);}

.btn-primary{background:var(--a2);color:#F7F1E4 !important;}
body:not(.bright) .btn-primary{color:#12150f !important;}
body:not(.bright) .evrow.use .evtoggle{color:#12150f;}
#kula-mode-toggle #kmt-icon svg{width:1rem;height:1rem;display:block;}
</style>
</head>
<body class="bright">
<script>/* kula: LMS embed events. "completed" fires once, when the learner reaches the closing screen. "advance" fires from the final button. */
(function(){var sentCompleted=false;window.kulaEmbed=function(ev){if(ev==="completed"){if(sentCompleted)return;sentCompleted=true;}try{window.parent.postMessage({type:"lms-embed-event",version:"1.0",payload:{event:ev}},"*");}catch(e){}};})();</script>
<button id="kula-mode-toggle" type="button" onclick="kulaToggle()" aria-label="Switch light or dark mode"><span id="kmt-icon"></span><span id="kmt-label"></span></button>
<div class="container"><div id="stage"></div></div>
<script>
var K="kula-theme-2";var SUN="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4.2'/><path d='M12 1.6v2M12 20.4v2M3.6 12h-2M22.4 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4'/></svg>";var MOON="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z'/></svg>";function paint(){var d=!document.body.classList.contains("bright");var ic=document.getElementById("kmt-icon"),la=document.getElementById("kmt-label");if(ic)ic.innerHTML=d?SUN:MOON;if(la)la.textContent=d?"Light mode":"Dark mode";}window.kulaToggle=function(){document.body.classList.toggle("bright");try{localStorage.setItem(K,document.body.classList.contains("bright")?"light":"dark")}catch(e){}paint();};try{if(localStorage.getItem(K)==="dark")document.body.classList.remove("bright")}catch(e){}paint();
var esc=function(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;};
var frame={}, idx=0;

var COVER={
  eyebrow:"Kula Revise \u00b7 Grade 12 History \u00b7 Vietnam",
  title:"Build the Skeleton",
  lines:["Fifty marks. One hour. Three pages.","You will not write the essay here.","You build its skeleton: the line, the points, the evidence, the verdict.","Then you take the frame away and write it in your own words."]
};

var STEPS=[
  {type:'cover'},
  {type:'pick', tag:'Introduction · your line of argument', prog:'Line of argument',
    h2:'Choose your line of argument',
    intro:'Every mark in this essay hangs off one sentence: the line you argue. The question says critically discuss, so your line has to take a side and be ready to weigh the other. Pick the sentence that argues, not the one that only describes.',
    correct:0,
    opts:[
      "Vietcong tactics never beat the United States in battle, but they made every American strategy cost more than it was worth, and that broke America's will to keep fighting.",
      "The Vietcong used a range of tactics during the war, and the United States replied with several strategies of its own.",
      "Vietcong tactics beat the United States in the field and won the war through greater firepower."
    ],
    expl:"<b>The first argues.</b> It admits the Vietcong never won in the field, then says what their tactics did do, so the essay has a line to hold. The second only describes. The third takes the wrong line: the facts show the Vietcong never won a stand-up battle, so you would be arguing against your own evidence.",
    save:function(s){frame.arg=s.opts[0];}},

  {type:'pick', tag:'Body 1 · American strategy', prog:'Body 1 of 3 · claim',
    h2:'Body paragraph 1: the topic sentence',
    intro:'Your first body paragraph is about American strategy. Every paragraph opens with a claim that pushes your line forward. Pick the topic sentence that takes a clear position.',
    correct:0,
    opts:[
      "American strategy was built for a war that was not being fought.",
      "The United States used a number of military strategies during the Vietnam War.",
      "American strategy suited the war well and came close to winning it outright."
    ],
    expl:"<b>The first takes a side:</b> the strategy was aimed at the wrong war. The second only describes that strategies existed. The third takes the wrong line: the facts show the strategy missing its target, not nearly winning.",
    save:function(s){frame.b1ts=s.opts[0];}},
  {type:'evidence', tag:'Body 1 · American strategy', prog:'Body 1 of 3 · evidence',
    h2:'Now choose the evidence',
    ts:"American strategy was built for a war that was not being fought.",
    intro:'A claim is only worth the evidence under it. Tap Use it for the facts that back this exact point. Leave out the real facts that belong to a different paragraph.',
    items:[
      {t:"Rolling Thunder bombed the North (1965-68) to cut its supply lines", use:true},
      {t:"Search and Destroy sweeps hunted an enemy that could not be found", use:true},
      {t:"Huge firepower needed a target, but the enemy hid among the people", use:true},
      {t:"A conventional war of massed troops and artillery, against a hidden enemy", use:true},
      {t:"Tet reached the US embassy grounds in Saigon, 1968", use:false, off:"that is the Tet point, another paragraph"},
      {t:"Agent Orange was sprayed from 1962 to 1971", use:false, off:"that is the countryside response"}
    ],
    expl:"<b>The four strategy facts back this point.</b> Tet and Agent Orange are real and correctly dated, which is what tempts you, but each belongs to a different paragraph.",
    link:"Strength only counts once it has a target, and there was no target to hit.",
    save:function(s){frame.b1ev=s.chosen; frame.b1link=s.link;}},

  {type:'pick', tag:'Body 2 · Vietcong tactics', prog:'Body 2 of 3 · claim',
    h2:'Body paragraph 2: the topic sentence',
    intro:'Your second body paragraph turns to Vietcong tactics. This is where you show why the American strategy could not land. Pick the topic sentence that takes a clear position.',
    correct:0,
    opts:[
      "Vietcong tactics were built to turn that weakness against the Americans.",
      "The Vietcong used guerrilla tactics throughout the war against American forces.",
      "Vietcong tactics relied on large open battles and head-on clashes with US troops."
    ],
    expl:"<b>The first connects to your argument:</b> the tactics were made to beat the strategy you just described. The second only describes. The third takes the wrong line: the Vietcong avoided open battle, they did not seek it.",
    save:function(s){frame.b2ts=s.opts[0];}},
  {type:'evidence', tag:'Body 2 · Vietcong tactics', prog:'Body 2 of 3 · evidence',
    h2:'Now choose the evidence',
    ts:"Vietcong tactics were built to turn that weakness against the Americans.",
    intro:'Same job again: tap Use it for the facts that prove this point about their tactics. Leave out the ones that belong to another paragraph.',
    items:[
      {t:"Booby traps, hit-and-run raids and sabotage", use:true},
      {t:"Tunnel systems dug too narrow for American soldiers", use:true},
      {t:"They took the lead without ever holding ground", use:true},
      {t:"They hid among the people, so American firepower hit civilians", use:true},
      {t:"Rolling Thunder bombed the North from March 1965", use:false, off:"that is American strategy"},
      {t:"The Soviet Union and China supplied the North with modern weapons", use:false, off:"that is the counter-argument"}
    ],
    expl:"<b>The four tactics facts build this point.</b> Rolling Thunder is American strategy, and Soviet and Chinese weapons are the other side you will raise next. Keep each fact in the paragraph it actually proves.",
    link:"They never had to win a battle. They only had to make the war cost more than it was worth.",
    save:function(s){frame.b2ev=s.chosen; frame.b2link=s.link;}},

  {type:'pick', tag:'Body 3 · counter-argument', prog:'Body 3 of 3 · claim',
    h2:'Body paragraph 3: the other side',
    intro:'The command word is critically discuss, so you must put the other side before you decide. Pick the topic sentence that states the opposing case fairly.',
    correct:0,
    opts:[
      "The claim cannot be pushed all the way.",
      "There were several other things going on in the war besides Vietcong tactics.",
      "Vietcong tactics were the only reason the United States lost the war."
    ],
    expl:"<b>The first states the other side fairly,</b> which is what the counter-argument step needs. The second only describes. The third overstates your own case, so there is nothing left to weigh.",
    save:function(s){frame.c1ts=s.opts[0];}},
  {type:'evidence', tag:'Body 3 · counter-argument', prog:'Body 3 of 3 · evidence',
    h2:'The evidence for the other side',
    ts:"The claim cannot be pushed all the way.",
    intro:'Here you gather the strongest facts for the opposing case. Tap Use it for the ones that show other forces at work. Leave out the facts that back your own line: they cannot be the counter.',
    items:[
      {t:"The Soviet Union and China supplied the North with modern weapons", use:true},
      {t:"After Tet, the North's regular army did most of the fighting", use:true},
      {t:"Saigon finally fell to a conventional invasion in 1975", use:true},
      {t:"Booby traps and tunnels gave the guerrillas the initiative", use:false, off:"that backs your own line, not the other side"},
      {t:"Rolling Thunder bombed the North from 1965", use:false, off:"American strategy, not the other side"}
    ],
    expl:"<b>These three facts are the strongest case for the other side.</b> The booby traps and Rolling Thunder back your own argument, so they cannot be the counter. Then you rebut: the tactics had already broken American will years before the tanks arrived.",
    link:"But the tactics had already broken American willingness to keep paying, years before the tanks rolled into Saigon.",
    save:function(s){frame.c1ev=s.chosen; frame.c1link=s.link;}},

  {type:'pick', tag:'Conclusion · the verdict', prog:'Verdict',
    h2:'Land your verdict',
    intro:'A conclusion weighs both sides and still decides. Pick the verdict that does both. Avoid the absolute one and the one that sits on the fence.',
    correct:0,
    opts:[
      "The statement holds to a great extent, though not completely: the Vietcong never won in the field, and Soviet and Chinese weapons and the North's regular army mattered, but their tactics broke American will to keep paying, which is what the war was decided on.",
      "Vietcong tactics won the war completely and on their own.",
      "Vietcong tactics had some successes and some failures, so it is hard to say whether they mattered."
    ],
    expl:"<b>The first weighs and still decides.</b> It admits the limits (no field victory, foreign weapons) and lands on the judgement the command word wants. The second is absolute; the third sits on the fence. Listing good and bad without deciding throws away your conclusion.",
    save:function(s){frame.verdict=s.opts[0];}},

  {type:'frame'}
];

var stage=document.getElementById('stage');
function next(){ idx++; render(); window.scrollTo(0,0); }
function render(){
  var s=STEPS[idx];
  if(s.type==='cover') return renderCover();
  if(s.type==='pick') return renderPick(s);
  if(s.type==='evidence') return renderEvidence(s);
  if(s.type==='frame') return renderFrame();
}
function prog(s){ return s.prog?('<div class="cap-prog">Step '+idx+' of '+(STEPS.length-2)+' \u00b7 '+s.prog+'</div>'):''; }

function renderCover(){
  var lines=COVER.lines.map(function(l){return '<span>'+esc(l)+'</span>';}).join('<br>');
  stage.innerHTML='<div class="cover"><div class="cover-eyebrow">'+COVER.eyebrow+'</div>'+
    '<h1 class="cover-title">'+esc(COVER.title)+'</h1><div class="flourish"></div>'+
    '<div class="cover-line" id="cover-line">'+lines+'</div>'+
    '<button class="btn-begin" id="begin-btn">Begin <span class="sa">&rarr;</span></button></div>';
  var sp=[].slice.call(document.querySelectorAll('#cover-line span'));
  sp.forEach(function(x,i){setTimeout(function(){x.classList.add('vis');}, 300+i*450);});
  document.getElementById('begin-btn').onclick=next;
}

function renderPick(s){
  var chosen=null;
  function draw(){
    var opts=s.opts.map(function(o,i){
      var cls='option', mark='';
      if(chosen!==null){ cls+=' selected'; if(i===s.correct){cls+=' correct'; mark='<span class="opt-mark">&#10003;</span>';} else if(i===chosen){cls+=' wrong'; mark='<span class="opt-mark">&#10007;</span>';} else {cls+=' dimmed';} }
      return '<button class="'+cls+'" data-i="'+i+'"'+(chosen!==null?' disabled':'')+'><span class="opt-letter">'+String.fromCharCode(65+i)+'</span><span class="opt-text">'+esc(o)+'</span>'+mark+'</button>';
    }).join('');
    var tail = chosen!==null ? '<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">'+s.expl+'</div></div><div class="cap-actions" style="margin-top:1.2rem"><button class="btn-primary" id="cont">Continue</button></div>' : '';
    stage.innerHTML=prog(s)+'<div class="card"><div class="stage-tag">'+s.tag+'</div><h2>'+esc(s.h2)+'</h2><p class="cap-intro">'+s.intro+'</p><div class="options">'+opts+'</div>'+tail+'</div>';
    if(chosen===null){ [].forEach.call(document.querySelectorAll('.option'),function(b){ b.onclick=function(){ chosen=+b.getAttribute('data-i'); draw(); }; }); }
    else { document.getElementById('cont').onclick=function(){ s.save(s); next(); }; }
  }
  draw();
}

function renderEvidence(s){
  var done=false, state={};
  function draw(){
    var rows=s.items.map(function(it,i){
      var cls='evrow', right='';
      if(state[i]&&!done) cls+=' use';
      if(done){ var u=!!state[i]; if(it.use&&u){cls+=' ok';right='<span class="evtag y">USE</span>';} else if(it.use&&!u){cls+=' miss';right='<span class="evtag y">USE</span>';} else if(!it.use&&u){cls+=' wrong';right='<span class="evtag n">LEAVE OUT</span>';} else {right='<span class="evtag n">LEAVE OUT</span>';} }
      var off = (done&&it.off)?'<span class="off">'+esc(it.off)+'</span>':'';
      var ctrl = done ? right : '<button class="evtoggle" data-i="'+i+'">'+(state[i]?'Using \u2713':'Use it')+'</button>';
      return '<div class="'+cls+'"><span class="evtext">'+esc(it.t)+off+'</span>'+ctrl+'</div>';
    }).join('');
    var foot;
    if(!done) foot='<div class="cap-actions"><button class="btn-primary" id="chk" disabled>Check my selection</button></div>';
    else foot='<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">'+s.expl+'</div></div><div class="cap-actions" style="margin-top:1.2rem"><button class="btn-primary" id="cont">Continue</button></div>';
    stage.innerHTML=prog(s)+'<div class="card"><div class="stage-tag">'+s.tag+'</div><h2>'+esc(s.h2)+'</h2>'+
      '<div class="yourpoint"><b>Your point</b>'+esc(s.ts)+'</div><p class="cap-intro">'+s.intro+'</p><div class="evlist">'+rows+'</div>'+foot+'</div>';
    if(!done){
      [].forEach.call(document.querySelectorAll('.evtoggle'),function(b){ b.onclick=function(){ var i=+b.getAttribute('data-i'); state[i]=!state[i]; draw(); }; });
      document.getElementById('chk').disabled=Object.keys(state).filter(function(k){return state[k];}).length===0;
      document.getElementById('chk').onclick=function(){ done=true; draw(); };
    } else {
      s.chosen=s.items.filter(function(x,i){return state[i]&&x.use;}).map(function(x){return x.t;});
      if(s.chosen.length===0) s.chosen=s.items.filter(function(x){return x.use;}).map(function(x){return x.t;});
      document.getElementById('cont').onclick=function(){ s.save(s); next(); };
    }
  }
  draw();
}

function renderFrame(){
  function ul(a){return '<ul>'+(a||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}
  var f='<div class="fp"><div class="frole">Line of argument</div><div class="fts">'+esc(frame.arg)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 1 \u00b7 political policies</div><div class="fts">'+esc(frame.b1ts)+'</div><div class="flabel">Evidence</div>'+ul(frame.b1ev)+'<div class="flink">Link: '+esc(frame.b1link)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 2 \u00b7 economic policies</div><div class="fts">'+esc(frame.b2ts)+'</div><div class="flabel">Evidence</div>'+ul(frame.b2ev)+'<div class="flink">Link: '+esc(frame.b2link)+'</div></div>'+
    '<div class="fp"><div class="frole">Body 3 \u00b7 counter-argument</div><div class="fts">'+esc(frame.c1ts)+'</div><div class="flabel">Evidence for the other side</div>'+ul(frame.c1ev)+'<div class="flink">Rebuttal: '+esc(frame.c1link)+'</div></div>'+
    '<div class="fp"><div class="frole">Verdict</div><div class="fts">'+esc(frame.verdict)+'</div></div>';
  stage.innerHTML='<div class="card"><div class="stage-tag">Your writing frame</div><h2>Take this away and write it up</h2>'+
    '<p class="cap-intro">This is the shape of a top essay: a clear line, three paragraphs each with a claim and its evidence, and a verdict that decides. You built every choice in it.</p>'+
    '<div class="frame">'+f+'</div>'+
    '<div class="writeup"><b>Now write the essay in full, in your own words.</b><div class="wsub">The frame gives you the shape and the facts. Turning these notes into full sentences, in the exam, is the part only you can do.</div></div><div class="cap-actions" style="margin-top:1.4rem"><button class="btn-primary" id="cap-advance">Continue to What Stuck&nbsp;&rarr;</button></div></div>';
  document.getElementById('cap-advance').onclick=function(){ kulaEmbed('advance'); };
  kulaEmbed('completed');
}

render();
</script>
</body>
</html>
